name: Daily Sitemap Refresh

on:
  schedule:
    # Runs daily at 00:30 UTC -- 30 min after your puzzles go live at midnight,
    # so the sitemap update lands after the new daily content is deployed.
    # Adjust the hour/minute if your puzzle-generation pipeline runs later.
    - cron: '30 0 * * *'
  workflow_dispatch:  # lets you trigger it manually from the Actions tab

jobs:
  refresh-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh sitemap lastmod dates
        run: node scripts/refresh-sitemap-dates.js

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml
          git diff --staged --quiet || git commit -m "Auto-update sitemap lastmod dates"
          git push
