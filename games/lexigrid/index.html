    <style>
        :root {
            --bg: #0f172a; --tile-bg: #1e293b; --tile-active: #4f46e5; --trail: #f59e0b; --text: #f1f5f9; --accent: #818cf8;
            --cols: 4; --rows: 4;
        }
        [data-theme="cyber"] { --bg: #05050a; --tile-bg: #0c1220; --tile-active: #06b6d4; --trail: #ec4899; --text: #e0f2fe; --accent: #22d3ee; }
        [data-theme="amber"] { --bg: #18181b; --tile-bg: #27272a; --tile-active: #ea580c; --trail: #eab308; --text: #fafaf9; --accent: #fb923c; }
        [data-theme="emerald"] { --bg: #022c22; --tile-bg: #064e3b; --tile-active: #059669; --trail: #34d399; --text: #ecfdf5; --accent: #6ee7b7; }
        [data-theme="cosmic"] { --bg: #1e1b4b; --tile-bg: #2e2663; --tile-active: #9333ea; --trail: #a855f7; --text: #f5f3ff; --accent: #c084fc; }
        
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; user-select: none; }
        body { margin: 0; padding: 0; background: var(--bg); color: var(--text); overflow: hidden; display: flex; flex-direction: column; height: 100vh; font-variant-numeric: tabular-nums; }
        
        #fx-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 999; }
        #loadingScreen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s; }
        
        #back-link { position: absolute; top: 10px; left: 10px; color: var(--text); text-decoration: none; font-weight: bold; opacity: 0.7; z-index: 100; }
        
        header { padding: 40px 10px 10px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); z-index: 50; }
        .hud-stat { display: flex; flex-direction: column; align-items: center; font-size: 14px; font-weight: bold; }
        .hud-val { font-size: 20px; color: var(--accent); }
        
        main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        
        #board-container { position: relative; width: min(82vw, 68vh, 440px); height: min(82vw, 68vh, 440px); touch-action: none; margin: 0 auto; }
        #board-grid { position: absolute; inset: 0; }
        #trace-svg { position: absolute; inset: 0; pointer-events: none; width: 100%; height: 100%; overflow: visible; z-index: 10; }
        #trace-glow { fill: none; stroke: var(--trail); stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; opacity: 0.3; }
        #trace-core { fill: none; stroke: var(--trail); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
        .trace-valid #trace-glow { stroke: #4ade80; }
        .trace-valid #trace-core { stroke: #4ade80; }
        .trace-invalid #trace-glow { stroke: #f87171; }
        .trace-invalid #trace-core { stroke: #f87171; }
        
        .tile {
            background: var(--tile-bg); border-radius: 12px; border: 2px solid rgba(255,255,255,0.08);
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(24px, 6vw, 36px); font-weight: 700; color: var(--text);
            cursor: pointer; position: absolute;
            transition: top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.1s, box-shadow 0.1s;
            left: calc((100% / var(--cols)) * var(--c) + 4px);
            top: calc((100% / var(--rows)) * var(--r) + 4px);
            width: calc(100% / var(--cols) - 8px);
            height: calc(100% / var(--rows) - 8px);
            z-index: 5;
        }
        .tile.selected { background: var(--tile-active); transform: scale(0.92); box-shadow: 0 0 16px var(--accent); z-index: 6; }
        .tile.mult2 { border-color: #f59e0b; box-shadow: inset 0 0 10px #f59e0b44; }
        .tile.mult3 { border-color: #ef4444; box-shadow: inset 0 0 10px #ef444444; }
        .tile.frozen { background: linear-gradient(135deg, #bfdbfe88, #93c5fd44); border-color: #93c5fd; backdrop-filter: blur(2px); }
        .tile.frozen.cracked { background: linear-gradient(135deg, #bfdbfe44, #93c5fd22); }
        .tile.bomb::after { content: attr(data-countdown); position: absolute; top: 4px; right: 6px; font-size: 14px; color: #ef4444; font-weight: 900; background: rgba(0,0,0,0.5); border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
        .tile.wild { color: var(--trail); }
        .tile.keyboard-focus { outline: 3px solid var(--trail); outline-offset: 3px; }

        #word-display { height: 50px; font-size: 32px; font-weight: bold; letter-spacing: 2px; margin-top: 20px; display: flex; align-items: center; justify-content: center; text-transform: uppercase; }
        
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; flex-direction: column; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: var(--tile-bg); padding: 30px; border-radius: 16px; border: 1px solid var(--accent); max-width: 400px; width: 100%; text-align: center; max-height: 80vh; overflow-y: auto; position:relative; }
        
        .btn { background: var(--tile-active); color: #fff; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 5px; transition: transform 0.1s; }
        .btn:active { transform: scale(0.95); }
        
        #achievement-toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border: 1px solid var(--accent); padding: 15px 25px; border-radius: 30px; color: white; display: flex; align-items: center; gap: 10px; transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 9999; }
        #achievement-toast.show { bottom: 30px; }
        
        .stage-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 20px; }
        .stage-btn { background: rgba(0,0,0,0.3); border: 2px solid #333; border-radius: 8px; padding: 15px 0; font-weight: bold; cursor: pointer; color: #fff; position: relative; display:flex; flex-direction:column; align-items:center; }
        .stage-btn.unlocked { border-color: var(--accent); background: var(--tile-bg); }
        .stars { display: flex; gap: 2px; margin-top: 4px; font-size: 10px; color: #444; }
        .stars .on { color: gold; }
        
        #float-container { position: fixed; inset: 0; pointer-events: none; z-index: 500; }
        .float-score { position: absolute; color: var(--trail); font-weight: bold; font-size: 24px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); animation: floatUp 1s forwards; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-40px) scale(1.5); } }
        
        .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 15px; }
        .cal-day { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.2); border-radius: 4px; font-size: 12px; }
        .cal-day.done { background: #059669; color: white; box-shadow: 0 0 8px #059669; }
    </style>

    <!-- Modals -->
    <div id="menu-modal" class="modal active">
        <div class="modal-content">

            <button class="btn" style="width:100%" onclick="openStageSelect()">Adventure Mode</button>
            <button class="btn" style="width:100%" onclick="startGame('collapse')">Collapse Mode</button>
            <button class="btn" style="width:100%" onclick="startGame('blitz')">Blitz (120s)</button>
            <button class="btn" style="width:100%" onclick="startGame('daily')">Daily Challenge</button>
            <div style="margin-top: 20px; display:flex; justify-content:center; gap: 10px;">

                <button class="btn" onclick="populateAchvModal(); showModal('achievements-modal')">🏆 Achvs</button>

        </div>
    </div>
    
    <div id="stage-modal" class="modal">
        <div class="modal-content" style="max-width:500px">
            <h2>Adventure Stages</h2>
            <div id="stage-grid" class="stage-grid"></div>
            <button class="btn" style="margin-top:20px" onclick="showModal('menu-modal')">Back</button>
        </div>
    </div>
    
    <div id="end-modal" class="modal">
        <div class="modal-content">
            <h2 id="end-title">Stage Clear!</h2>
            <p id="end-desc"></p>
            <div id="end-stars" style="font-size:30px; letter-spacing:10px; margin: 10px 0;">⭐⭐⭐</div>

            <button class="btn" onclick="shareResult()">Share Result</button>
            <button class="btn" id="end-next-btn" onclick="showModal('menu-modal')">Continue</button>
        </div>
    </div>
    
    <div id="vault-modal" class="modal">
        <div class="modal-content">
            <h2>Vault (Themes)</h2>
            <p>Spend LexiShards to unlock themes.</p>
            <div id="themes-list" style="display:flex; flex-direction:column; gap:10px; text-align:left;"></div>
            <button class="btn" style="margin-top:20px" onclick="hideModal()">Close</button>
        </div>
    </div>
    
    <div id="stats-modal" class="modal">
        <div class="modal-content">
            <h2>Daily Streak</h2>
            <p id="streak-text"></p>
            <div class="calendar" id="calendar-grid"></div>
            <button class="btn" style="margin-top:20px" onclick="hideModal()">Close</button>
        </div>
    </div>
    
    <div id="achievements-modal" class="modal">

            <div id="achievements-list" style="max-height:300px; overflow-y:auto; text-align:left; display:flex; flex-direction:column; gap:10px;"></div>
            <button class="btn" style="margin-top:20px" onclick="hideModal()">Close</button>
        </div>
    </div>

        // 1. Trie
        class TrieNode { constructor() { this.c = {}; this.e = false; } }
        class Trie {
            constructor() { this.root = new TrieNode(); }
            insert(word) { let n = this.root; for(let ch of word) { if(!n.c[ch]) n.c[ch] = new TrieNode(); n = n.c[ch]; } n.e = true; }
            check(word) { let n = this.root; for(let ch of word) { if(!n.c[ch]) return 0; n = n.c[ch]; } return n.e ? 2 : 1; }
        }
        const dictTrie = new Trie();
        
        // 2. Configs
        const STAGES = [];
        for(let i=1; i<=25; i++) {
            if(i<=5) STAGES.push({ id:i, target: 500+i*200, moves: 8+i*2, desc: `Score ${500+i*200} in ${8+i*2} moves` });
            else if(i<=12) STAGES.push({ id:i, frozen: 4+Math.floor((i-5)/2), moves: 10+(i-5), desc: `Break ${4+Math.floor((i-5)/2)} ice blocks` });
            else if(i<=18) STAGES.push({ id:i, bomb: 2+Math.floor((i-12)/3), moves: 12+(i-12), desc: `Defuse ${2+Math.floor((i-12)/3)} bombs` });
            else STAGES.push({ id:i, target: 1500, frozen: 4, bomb: 2, moves: 18, desc: `Master Trial ${i-18}` });
        }
        
        const BIOMES = [
            { id: 'slate', name: 'Slate Core', cost: 0 },
            { id: 'cyber', name: 'Cyber Neon', cost: 100 },
            { id: 'amber', name: 'Amber Flare', cost: 100 },
            { id: 'emerald', name: 'Emerald Forest', cost: 100 },
            { id: 'cosmic', name: 'Cosmic Nebula', cost: 100 }
        ];
        
        const ACHVS = [
            {id:'first_word', n:'First Word', d:'Submit your first word.'},
            {id:'long_word', n:'Long Word', d:'Submit a 6+ letter word.'},
            {id:'combo_5', n:'Combo Master', d:'Reach a 5-word combo streak.'},
            {id:'score_1000', n:'High Scorer', d:'Reach 1,000 score in one game.'},
            {id:'lifetime_100', n:'Centurion', d:'Submit 100 total words (lifetime).'},
            {id:'adventure_3', n:'Adventurer', d:'Clear 3 Adventure stages.'},
            {id:'adventure_3stars', n:'Perfectionist', d:'Clear 5 stages with 3 stars.'},
            {id:'streak_7', n:'Dedicated', d:'Complete 7-day daily streak.'},
            {id:'shards_500', n:'Wealthy', d:'Accumulate 500 LexiShards.'},
            {id:'bomb_defuse', n:'Bomb Squad', d:'Defuse a bomb tile.'},
            {id:'ice_break', n:'Ice Breaker', d:'Break a frozen tile.'},
            {id:'wildcard_use', n:'Wildcard', d:'Submit a word using the wildcard.'}
        ];
        
        // 3. Engines
        const AdProvider = {
            init() {}, gameplayStart() {}, gameplayStop() {},
            gameLoadingFinished() { console.log('AdProvider ready'); },
            commercialBreak(cb) { if(cb) cb(); }
        };
        
        const AudioEngine = {
            ctx: null,
            init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            play(freqs, type, dur, vol=0.1) {
                if(localStorage.getItem('lexigrid_muted')==='1') return;
                this.init();
                freqs.forEach((f, i) => {
                    setTimeout(() => {
                        let osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                        osc.type = type; osc.frequency.value = f;
                        osc.connect(gain); gain.connect(this.ctx.destination);
                        osc.start(); gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
                        osc.stop(this.ctx.currentTime + dur);
                    }, i * 80);
                });
            },
            note(idx) { const notes = [261.63, 293.66, 329.63, 392, 440, 523.25, 587.33]; this.play([notes[Math.min(idx, notes.length-1)]], 'sine', 0.2); },
            valid() { this.play([261.6, 329.6, 392.0, 523.25], 'triangle', 0.2); },
            invalid() { this.play([220, 185], 'sawtooth', 0.2, 0.05); },
            shatter() { this.play([1000, 1500, 2000], 'square', 0.1, 0.02); },
            achievement() { this.play([880, 1047, 1319], 'triangle', 0.3); }
        };
        
        const fxCanvas = document.getElementById('fx-canvas');
        const fxCtx = fxCanvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { fxCanvas.width = window.innerWidth; fxCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();
        
        function spawnParticles(x, y, color, type, count) {
            for(let i=0; i<count; i++) {
                let ang = Math.random() * Math.PI * 2;
                let spd = Math.random() * 5 + 2;
                particles.push({
                    x, y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd,
                    life: 1, type, color, size: Math.random()*4+2
                });
            }
        }
        function updateParticles() {
            fxCtx.clearRect(0,0, fxCanvas.width, fxCanvas.height);
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                if(p.type==='shard') p.vy += 0.15; // gravity
                p.life -= 0.02;
                if(p.life <= 0) { particles.splice(i,1); continue; }
                fxCtx.globalAlpha = Math.max(0, p.life);
                fxCtx.fillStyle = p.color;
                fxCtx.beginPath();
                if(p.type==='spark') fxCtx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                else fxCtx.rect(p.x, p.y, p.size, p.size);
                fxCtx.fill();
            }
            fxCtx.globalAlpha = 1;
            requestAnimationFrame(updateParticles);
        }
        requestAnimationFrame(updateParticles);
        
        // 4. State & PRNG
        let rand = Math.random;
        function mulberry32(a) { return function() { var t = a += 0x6D2B79F5; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; } }
        const VOWELS = "AAAAEEEEIIIOOOUU";
        const CONS = "BBCCDDFFGGHHJKLLMMNNPPRRSSTTVVWWXYYZ";
        function getRandomLetter() { return (rand() < 0.4) ? VOWELS[Math.floor(rand() * VOWELS.length)] : CONS[Math.floor(rand() * CONS.length)]; }
        
        let STATE = { mode: 'menu', stage: null, score: 0, moves: 20, time: 120, combo: 1, shards: parseInt(localStorage.getItem('lexigrid_shards')||0), board: [], path: [], wordsSubmitted: parseInt(localStorage.getItem('lexigrid_words')||0) };
        let COLS = 4, ROWS = 4;
        let isSubmitting = false, isDragging = false;
        let comboTimer = null, gameTimer = null;
        
        // 5. Game Logic
        function startGame(mode, stageId=null) {
            STATE.mode = mode; STATE.stage = stageId;
            STATE.score = 0; STATE.combo = 1; STATE.path = [];
            COLS = (mode==='blitz' && localStorage.getItem('lexigrid_expert')==='1') ? 5 : 4; ROWS = COLS;
            document.documentElement.style.setProperty('--cols', COLS);
            document.documentElement.style.setProperty('--rows', ROWS);
            
            if(mode === 'daily') {
                let d = new Date(); rand = mulberry32(d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate());
            } else rand = Math.random;
            
            if(mode === 'blitz') { STATE.time = 120; document.getElementById('ui-time-box').style.display='flex'; document.getElementById('ui-moves-box').style.display='none'; }
            else { STATE.moves = (stageId ? STAGES[stageId-1].moves : 20); document.getElementById('ui-time-box').style.display='none'; document.getElementById('ui-moves-box').style.display='flex'; }
            
            initBoard(); updateHUD(); hideModal();
            document.getElementById('objective-text').innerText = stageId ? STAGES[stageId-1].desc : (mode==='collapse'?"Survive!":(mode==='daily'?"Daily Challenge":"Score max in 120s!"));
            
            clearInterval(gameTimer);
            if(mode === 'blitz') {
                gameTimer = setInterval(() => {
                    STATE.time--; updateHUD();
                    if(STATE.time<=0) endGame(false);
                }, 1000);
            }
            AdProvider.gameplayStart();
        }
        
        function initBoard() {
            const grid = document.getElementById('board-grid');
            grid.innerHTML = ''; STATE.board = [];
            for(let r=0; r<ROWS; r++) {
                let row = [];
                for(let c=0; c<COLS; c++) { let t = createTile(r, c, false); row.push(t); grid.appendChild(t.el); }
                STATE.board.push(row);
            }
            
            if(STATE.mode === 'adventure') {
                let st = STAGES[STATE.stage-1];
                let specialCount = (st.frozen||0) + (st.bomb||0);
                let flat = STATE.board.flat().sort(() => rand() - 0.5);
                for(let i=0; i<specialCount; i++) {
                    if(i < (st.frozen||0)) flat[i].type = 'frozen';
                    else { flat[i].type = 'bomb'; flat[i].countdown = 5; }
                    updateTileDOM(flat[i]);
                }
            } else if(STATE.mode !== 'daily') {
                let flat = STATE.board.flat();
                flat[Math.floor(rand()*16)].type = 'wild';
                flat[Math.floor(rand()*16)].type = (rand()>0.5?'mult2':'mult3');
                flat.forEach(t => updateTileDOM(t));
            }
        }
        
        function createTile(r, c, isDrop) {
            let letter = getRandomLetter();
            let el = document.createElement('div');
            el.className = 'tile';
            el.innerHTML = `<span>${letter}</span>`;
            el.style.setProperty('--r', isDrop ? r - ROWS : r);
            el.style.setProperty('--c', c);
            if(isDrop) setTimeout(() => el.style.setProperty('--r', r), 50);
            return { id: r*100+c+rand(), r, c, letter, type: 'normal', el, countdown: 0, actualLetter: letter };
        }
        
        function updateTileDOM(t) {
            t.el.className = `tile ${t.type} ${t.type==='frozen' && t.cracked?'cracked':''}`;
            t.el.querySelector('span').innerText = t.type==='wild' ? '?' : t.letter;
            if(t.type==='bomb') t.el.dataset.countdown = t.countdown;
        }
        
        // 6. Interaction
        const bg = document.getElementById('board-container');
        bg.addEventListener('pointerdown', e => {
            if(isSubmitting) return;
            AudioEngine.init();
            let el = e.target.closest('.tile');
            if(el) { isDragging = true; STATE.path = []; handleEnter(el); }
            e.preventDefault();
        });
        window.addEventListener('pointermove', e => {
            if(!isDragging || isSubmitting) return;
            let el = document.elementFromPoint(e.clientX, e.clientY)?.closest('.tile');
            if(el) handleEnter(el);
        });
        window.addEventListener('pointerup', () => { if(isDragging) { isDragging = false; submitWord(); } });
        
        function handleEnter(tileEl) {
            let t = STATE.board.flat().find(x => x.el === tileEl);
            if(!t) return;
            if(STATE.path.includes(t)) {
                let idx = STATE.path.indexOf(t);
                if(idx < STATE.path.length-1) {
                    STATE.path.slice(idx+1).forEach(pt => pt.el.classList.remove('selected'));
                    STATE.path = STATE.path.slice(0, idx+1);
                    AudioEngine.note(STATE.path.length-1); updateTrace();
                }
                return;
            }
            if(STATE.path.length > 0) {
                let last = STATE.path[STATE.path.length-1];
                if(Math.abs(last.r - t.r) > 1 || Math.abs(last.c - t.c) > 1) return;
            }
            STATE.path.push(t); t.el.classList.add('selected');
            
            if(t.type === 'wild') {
                let p = STATE.path.map(x=>x.actualLetter).join('').slice(0,-1);
                t.actualLetter = 'A';
                for(let ch of "ABCDEFGHIJKLMNOPQRSTUVWXYZ") { if(dictTrie.check(p+ch) > 0) { t.actualLetter = ch; break; } }
                t.el.querySelector('span').innerText = t.actualLetter;
            } else t.actualLetter = t.letter;
            
            AudioEngine.note(STATE.path.length-1); updateTrace();
            let word = STATE.path.map(x=>x.actualLetter).join('');
            document.getElementById('word-display').innerText = word;
            let st = dictTrie.check(word);
            document.getElementById('trace-svg').setAttribute('class', st===2 ? 'trace-valid' : (st===1 ? '' : 'trace-invalid'));
        }
        
        function updateTrace() {
            if(STATE.path.length < 2) { document.getElementById('trace-glow').setAttribute('d',''); document.getElementById('trace-core').setAttribute('d',''); return; }
            let pts = STATE.path.map(t => {
                let rect = t.el.getBoundingClientRect(), pRect = bg.getBoundingClientRect();
                return `${rect.left - pRect.left + rect.width/2},${rect.top - pRect.top + rect.height/2}`;
            });
            let d = `M ${pts[0]} ` + pts.slice(1).map(p => `L ${p}`).join(' ');
            document.getElementById('trace-glow').setAttribute('d', d); document.getElementById('trace-core').setAttribute('d', d);
        }
        
        // 7. Submission
        function submitWord() {
            if(STATE.path.length < 3) { clearPath(); return; }
            isSubmitting = true;
            let word = STATE.path.map(x=>x.actualLetter).join('');
            if(dictTrie.check(word) === 2) {
                checkAchv('first_word');
                if(word.length >= 6) checkAchv('long_word');
                STATE.wordsSubmitted++; localStorage.setItem('lexigrid_words', STATE.wordsSubmitted);
                if(STATE.wordsSubmitted >= 100) checkAchv('lifetime_100');
                
                AudioEngine.valid();
                let base = [0,0,0,100,200,400,700,1100,1600][Math.min(word.length, 8)];
                let mult = 1, usedWild = false;
                STATE.path.forEach(t => {
                    if(t.type==='mult2') mult *= 2; if(t.type==='mult3') mult *= 3;
                    if(t.type==='wild') usedWild = true;
                });
                if(usedWild) checkAchv('wildcard_use');
                
                let pts = Math.floor(base * mult * STATE.combo);
                STATE.score += pts;
                if(STATE.score >= 1000) checkAchv('score_1000');
                
                let rect = STATE.path[STATE.path.length-1].el.getBoundingClientRect();
                showFloatingScore(pts, rect.left, rect.top);
                spawnParticles(rect.left+rect.width/2, rect.top+rect.height/2, 'var(--trail)', 'spark', 15);
                
                STATE.shards += (word.length==4?5:(word.length==5?15:(word.length>=6?35:0)));
                localStorage.setItem('lexigrid_shards', STATE.shards);
                if(STATE.shards >= 500) checkAchv('shards_500');
                
                STATE.combo = Math.min(3, STATE.combo + 0.5);
                if(STATE.combo >= 2.5) checkAchv('combo_5');
                clearTimeout(comboTimer);
                comboTimer = setTimeout(() => { STATE.combo = 1; updateHUD(); }, 5000);
                
                let toRemove = [];
                STATE.path.forEach(t => {
                    if(t.type==='frozen') {
                        if(!t.cracked) { t.cracked = true; updateTileDOM(t); AudioEngine.shatter(); }
                        else { toRemove.push(t); checkAchv('ice_break'); }
                    } else toRemove.push(t);
                    if(t.type==='bomb') { AudioEngine.shatter(); spawnParticles(rect.left, rect.top, '#ef4444', 'spark', 20); checkAchv('bomb_defuse'); }
                });
                
                STATE.board.flat().forEach(t => {
                    if(t.type==='bomb' && !toRemove.includes(t)) {
                        t.countdown--; updateTileDOM(t);
                        if(t.countdown<=0) {
                            STATE.score = Math.max(0, STATE.score - 500); t.type = 'normal'; updateTileDOM(t); AudioEngine.invalid();
                            bg.style.transform = 'translate(10px, 10px)'; setTimeout(()=>bg.style.transform='none', 100);
                        }
                    }
                });
                
                collapse(toRemove);
                if(STATE.mode !== 'blitz') STATE.moves--;
                checkWinLoss();
            } else { AudioEngine.invalid(); clearPath(); isSubmitting = false; }
            updateHUD();
        }
        
        function clearPath() {
            STATE.path.forEach(t => t.el.classList.remove('selected')); STATE.path = [];
            document.getElementById('word-display').innerText = '';
            document.getElementById('trace-glow').setAttribute('d',''); document.getElementById('trace-core').setAttribute('d','');
            document.getElementById('trace-svg').setAttribute('class','');
        }
        
        function collapse(toRemove) {
            toRemove.forEach(t => t.el.remove());
            for(let c=0; c<COLS; c++) {
                let write = ROWS - 1;
                for(let r=ROWS-1; r>=0; r--) {
                    let t = STATE.board[r][c];
                    if(!toRemove.includes(t)) { STATE.board[write][c] = t; t.r = write; t.el.style.setProperty('--r', write); write--; }
                }
                for(let r=write; r>=0; r--) { let t = createTile(r, c, true); STATE.board[r][c] = t; document.getElementById('board-grid').appendChild(t.el); }
            }
            clearPath(); setTimeout(() => { isSubmitting = false; }, 300);
        }
        
        function checkWinLoss() {
            if(STATE.mode === 'adventure') {
                let st = STAGES[STATE.stage-1], won = false;
                if(st.target && STATE.score >= st.target) won = true;
                if(st.frozen && STATE.board.flat().filter(t=>t.type==='frozen').length===0) won = true;
                if(st.bomb && STATE.board.flat().filter(t=>t.type==='bomb').length===0) won = true;
                if(won) endGame(true); else if(STATE.moves <= 0) endGame(false);
            } else if (STATE.mode !== 'blitz' && STATE.moves <= 0) endGame(false);
        }
        
        function endGame(won) {
            AdProvider.gameplayStop(); clearInterval(gameTimer);
            let starsStr = won ? (STATE.moves >= STAGES[STATE.stage-1].moves*0.5 ? '⭐⭐⭐' : (STATE.moves >= STAGES[STATE.stage-1].moves*0.25 ? '⭐⭐' : '⭐')) : '❌';
            document.getElementById('end-title').innerText = won ? "Stage Clear!" : "Game Over";
            document.getElementById('end-desc').innerText = won ? `You earned 100 💎!` : `Better luck next time.`;
            document.getElementById('end-stars').innerText = STATE.mode==='adventure' ? starsStr : `Score: ${STATE.score}`;
            
            if(won && STATE.mode === 'adventure') {
                STATE.shards += 100; localStorage.setItem('lexigrid_shards', STATE.shards);
                let adv = JSON.parse(localStorage.getItem('lexigrid_adventure')||'{}');
                adv[STATE.stage] = Math.max(adv[STATE.stage]||0, starsStr.length);
                localStorage.setItem('lexigrid_adventure', JSON.stringify(adv));
                AudioEngine.play([523, 659, 784, 1047], 'sine', 0.2);
                
                let clearedCount = Object.keys(adv).length;
                if(clearedCount >= 3) checkAchv('adventure_3');
                if(Object.values(adv).filter(x=>x===3).length >= 5) checkAchv('adventure_3stars');
            }
            if(STATE.mode === 'daily') {
                let log = JSON.parse(localStorage.getItem('lexigrid_daily_log')||'[]');
                let today = new Date().toISOString().split('T')[0];
                if(!log.includes(today)) { log.push(today); localStorage.setItem('lexigrid_daily_log', JSON.stringify(log)); }
                if(log.length >= 7) checkAchv('streak_7');
            }
            showModal('end-modal');
        }
        
        // 8. Achievements
        function checkAchv(id) {
            let a = JSON.parse(localStorage.getItem('lexigrid_achievements')||'[]');
            if(!a.includes(id)) {
                a.push(id); localStorage.setItem('lexigrid_achievements', JSON.stringify(a));
                let ac = ACHVS.find(x=>x.id===id);
                document.getElementById('toast-title').innerText = ac.n;
                document.getElementById('toast-desc').innerText = ac.d;
                document.getElementById('achievement-toast').classList.add('show');
                AudioEngine.achievement();
                setTimeout(()=>document.getElementById('achievement-toast').classList.remove('show'), 4000);
            }
        }
        function populateAchvModal() {
            let list = document.getElementById('achievements-list'); list.innerHTML='';
            let a = JSON.parse(localStorage.getItem('lexigrid_achievements')||'[]');
            ACHVS.forEach(ac => {
                let d = document.createElement('div');
                d.style.padding = '10px'; d.style.background = 'rgba(255,255,255,0.05)'; d.style.borderRadius = '8px';
                d.innerHTML = `<b>${a.includes(ac.id)?'✅':'🔒'} ${ac.n}</b><br><small>${ac.d}</small>`;
                list.appendChild(d);
            });
        }
        
        // 9. UI Helpers
        function updateHUD() {
            document.getElementById('ui-score').innerText = STATE.score; document.getElementById('ui-moves').innerText = STATE.moves;
            document.getElementById('ui-time').innerText = STATE.time; document.getElementById('ui-combo').innerText = STATE.combo + 'x';
            document.getElementById('ui-shards').innerText = STATE.shards;
        }
        function showModal(id) { document.querySelectorAll('.modal').forEach(m=>m.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        function hideModal() { document.querySelectorAll('.modal').forEach(m=>m.classList.remove('active')); }
        
        function openStageSelect() {
            let grid = document.getElementById('stage-grid'); grid.innerHTML='';
            let adv = JSON.parse(localStorage.getItem('lexigrid_adventure')||'{}');
            STAGES.forEach(st => {
                let unlocked = st.id===1 || adv[st.id-1];
                let btn = document.createElement('div');
                btn.className = `stage-btn ${unlocked?'unlocked':''}`;
                btn.innerHTML = `<div>${st.id}</div><div class="stars">${'⭐'.repeat(adv[st.id]||0)}</div>`;
                if(unlocked) btn.onclick = () => startGame('adventure', st.id);
                grid.appendChild(btn);
            });
            showModal('stage-modal');
        }
        
        function setupThemes() {
            let list = document.getElementById('themes-list'); list.innerHTML='';
            let unlocked = JSON.parse(localStorage.getItem('lexigrid_themes')||'["slate"]');
            BIOMES.forEach(b => {
                let btn = document.createElement('button'); btn.className = 'btn';
                let isU = unlocked.includes(b.id) || b.cost===0;
                btn.innerText = `${b.name} ${isU ? '' : '(100💎)'}`;
                btn.onclick = () => {
                    if(isU) { document.documentElement.setAttribute('data-theme', b.id); localStorage.setItem('lexigrid_theme', b.id); hideModal(); }
                    else if(STATE.shards >= 100) {
                        STATE.shards -= 100; localStorage.setItem('lexigrid_shards', STATE.shards);
                        unlocked.push(b.id); localStorage.setItem('lexigrid_themes', JSON.stringify(unlocked));
                        setupThemes(); updateHUD();
                    }
                };
                list.appendChild(btn);
            });
            document.documentElement.setAttribute('data-theme', localStorage.getItem('lexigrid_theme')||'slate');
        }
        
        function showStatsModal() {
            let cal = document.getElementById('calendar-grid'); cal.innerHTML='';
            let log = JSON.parse(localStorage.getItem('lexigrid_daily_log')||'[]');
            for(let i=1; i<=30; i++) {
                let d = document.createElement('div');
                d.className = 'cal-day ' + (log.length>=i ? 'done' : '');
                d.innerText = i; cal.appendChild(d);
            }
            document.getElementById('streak-text').innerText = `Current Streak: ${log.length} days`;
            showModal('stats-modal');
        }
        
        function showFloatingScore(pts, x, y) {
            let el = document.createElement('div'); el.className = 'float-score'; el.innerText = '+' + pts;
            el.style.left = x + 'px'; el.style.top = y + 'px';
            document.getElementById('float-container').appendChild(el); setTimeout(()=>el.remove(), 1000);
        }
        function toggleMute() {
            let m = localStorage.getItem('lexigrid_muted')==='1'; localStorage.setItem('lexigrid_muted', m ? '0' : '1');
            document.getElementById('btn-mute').innerText = m ? '🔊' : '🔇';
        }
        function shareResult() {
            let text = `LexiGrid ${STATE.mode} 🟣\nScore: ${STATE.score}\nhttps://snappgrid.com/lexigrid`;
            if(navigator.clipboard) navigator.clipboard.writeText(text);
            let btn = document.getElementById('end-next-btn');
            btn.innerText = "Copied!"; setTimeout(()=>btn.innerText="Continue", 2000);
        }
        
        let focusedTile = -1; // keyboard nav state: index into flat board array

        window.addEventListener('keydown', e => {
            if(e.key==='Escape') { clearPath(); return; }
            
            // Arrow key tile focus navigation
            const cols = STATE.board ? STATE.board[0].length : 4;
            const total = STATE.board ? STATE.board.flat().length : 16;
            if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) {
                e.preventDefault();
                if(focusedTile < 0) focusedTile = 0;
                else if(e.key==='ArrowRight') focusedTile = Math.min(focusedTile + 1, total - 1);
                else if(e.key==='ArrowLeft')  focusedTile = Math.max(focusedTile - 1, 0);
                else if(e.key==='ArrowDown')  focusedTile = Math.min(focusedTile + cols, total - 1);
                else if(e.key==='ArrowUp')    focusedTile = Math.max(focusedTile - cols, 0);
                updateTileFocus();
                return;
            }
            // Enter or Space: select focused tile or submit
            if(e.key==='Enter' || e.key===' ') {
                e.preventDefault();
                if(focusedTile >= 0 && STATE.board) {
                    const row = Math.floor(focusedTile / cols);
                    const col = focusedTile % cols;
                    const tile = STATE.board[row] && STATE.board[row][col];
                    if(tile) {
                        if(STATE.path.includes(tile) && STATE.path.length > 1) submitWord();
                        else if(!STATE.path.includes(tile)) handleEnter(tile.el);
                    }
                }
            }
        });
        
        function updateTileFocus() {
            document.querySelectorAll('.tile').forEach(t => t.classList.remove('keyboard-focus'));
            if(!STATE.board || focusedTile < 0) return;
            const cols = STATE.board[0].length;
            const row = Math.floor(focusedTile / cols);
            const col = focusedTile % cols;
            const tile = STATE.board[row] && STATE.board[row][col];
            if(tile && tile.el) { tile.el.classList.add('keyboard-focus'); }
        }

        
        window.onload = () => {
            RAW_DICTIONARY.split(' ').forEach(w => dictTrie.insert(w.toUpperCase()));
            document.getElementById('loadingScreen').style.opacity = '0';
            setTimeout(() => document.getElementById('loadingScreen').style.display = 'none', 500);
            AdProvider.gameLoadingFinished();
            setupThemes();
            document.getElementById('btn-mute').innerText = localStorage.getItem('lexigrid_muted')==='1' ? '🔇' : '🔊';
        };
    </script>
